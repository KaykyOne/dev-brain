services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gulosos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gulosos}
      POSTGRES_DB: ${POSTGRES_DB:-gulosos}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Aplica as migrations antes da aplicação subir e encerra.
  migrate:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: &database-url postgresql://${POSTGRES_USER:-gulosos}:${POSTGRES_PASSWORD:-gulosos}@db:5432/${POSTGRES_DB:-gulosos}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
      args:
        # Fonte única do prefixo público (basePath), fixado no build.
        APP_URL: ${APP_URL:-http://localhost:3000}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      # Sobrescreve o DATABASE_URL do .env (que aponta para localhost, usado fora do Docker).
      DATABASE_URL: *database-url
      APP_URL: ${APP_URL:-http://localhost:3000}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # Consulta /login respeitando o prefixo (basePath) derivado do APP_URL.
      test:
        - CMD
        - node
        - -e
        - "const p=new URL(process.env.APP_URL).pathname.replace(/\\/+$$/,'');fetch('http://127.0.0.1:3000'+p+'/login').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

volumes:
  pgdata:
