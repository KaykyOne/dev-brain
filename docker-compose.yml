services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gulosos
      POSTGRES_PASSWORD: gulosos
      POSTGRES_DB: gulosos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gulosos -d gulosos"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
